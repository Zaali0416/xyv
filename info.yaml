---
# Tiny Tapeout project information
project:
  title:        "Water Management System IC"
  description:  "ASIC Logic for Water Tank Control, Debouncing, and Fault Detection"
  author:       "Your Name"
  github:       "YourGitHubUsername"
  discord:      ""
  language:     "Verilog"
  clock_hz:     50000000

# Specify the name of your top Verilog module and the file it lives in
# Tiny Tapeout requires the wrapper to follow the tt_um_<repo_name> naming convention
top_module:  "tt_um_xyv"

# List all Verilog files in src/ relative to the repository root
source_files:
  - "project.v"
  - "wms_ic_asci.v"

# Pinout mapping (mapped to Tiny Tapeout dedicated I/O pins)
pinout:
  # Dedicated Inputs (ui_in)
  ui_in:
    - "TANK_SENSORS[0]" # UP_10
    - "TANK_SENSORS[1]" # UP_30
    - "TANK_SENSORS[2]" # UP_50
    - "TANK_SENSORS[3]" # UP_70
    - "TANK_SENSORS[4]" # UP_90
    - "TANK_SENSORS[5]" # UP_100
    - "LT_SIGNAL"       # Lower Tank Probe
    - "WF_PROBE"        # Water Flow Probe

  # Dedicated Outputs (uo_out)
  uo_out:
    - "LED_UP[0]"       # LED UP 10%
    - "LED_UP[1]"       # LED UP 30%
    - "LED_UP[2]"       # LED UP 50%
    - "LED_UP[3]"       # LED UP 70%
    - "LED_UP[4]"       # LED UP 90%
    - "LED_UP[5]"       # LED UP 100%
    - "LED_LT"          # Lower Tank LED
    - "MOTOR"           # Pump Relay Output

  # Bidirectional I/O pins configured as inputs/outputs (uio_in / uio_out)
  uio_in:
    - "BUZZ_OFF"        # Alarm Mute Button
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"

  uio_out:
    - "Unused"
    - "ERROR"           # Fault Indicator
    - "BUZZER"          # Alarm Output
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"

  # Direction mask for Bidirectional pins: 1 = Output, 0 = Input
  # uio[0]=Input (BUZZ_OFF), uio[1]=Output (ERROR), uio[2]=Output (BUZZER)
  uio_oe:
    - 0
    - 1
    - 1
    - 0
    - 0
    - 0
    - 0
    - 0

# Documentation summary
documentation:
  inputs:       "Tank sensors, probes, mute button"
  outputs:      "Motor drive, tank level LEDs, error/buzzer alarms"
  how_it_works: "Controls pump based on upper/lower tank levels and trips fault if flow fails."
  how_to_test:  "Apply clock, pulse reset, manipulate TANK_SENSORS and probes."
